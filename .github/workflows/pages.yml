# Builds the site with Astro, runs the checks, and deploys dist/ to GitHub Pages.
# Needs, once, in the repository settings: Pages > Build and deployment > Source: "GitHub Actions".
# Actions are pinned by commit SHA (the tag in the comment); Node comes from .nvmrc and the
# dependencies from package-lock.json (npm ci).
name: Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Contrast of the colour tokens
        run: node scripts/check-contrast.mjs
      - name: Types (astro check)
        run: npx astro check
      - name: Build
        run: npm run build
      - name: Links, language pairs, hreflang, CSP hashes, sitemap
        run: python3 -I scripts/check-links.py
      - name: HTML and CSS (Nu HTML Checker)
        run: java -jar node_modules/vnu-jar/build/dist/vnu.jar --errors-only --skip-non-html --also-check-css dist
      - name: Language detection and memory (headless Chrome)
        run: node scripts/test-lang.mjs
        env:
          CHROME: /usr/bin/google-chrome
      - name: Hero text contrast against the pictures (headless Chrome)
        run: node scripts/check-hero-contrast.mjs
        env:
          CHROME: /usr/bin/google-chrome
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
